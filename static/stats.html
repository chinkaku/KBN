<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据统计 — 组合麻将</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#0a0f14;min-height:100vh;color:#b0bec5}
a.back{position:fixed;top:14px;left:16px;color:#546e7a;font-size:11px;font-weight:600;text-decoration:none;padding:4px 12px;border:1px solid rgba(0,229,255,.15);border-radius:10px;z-index:10}
a.back:hover{color:#00e5ff;border-color:#00e5ff}
.container{max-width:700px;margin:0 auto;padding:64px 20px 40px}
h1{font-size:28px;color:#e0e0e0;text-align:center;margin-bottom:4px;letter-spacing:2px}
h1 span{color:#00e5ff}
.sub{color:#546e7a;font-size:12px;text-align:center;margin-bottom:32px}
.card{background:rgba(30,42,60,.8);border:1px solid rgba(0,229,255,.1);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{color:#00e5ff;font-size:14px;font-weight:700;margin-bottom:14px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{text-align:center;padding:12px 8px;background:rgba(0,229,255,.04);border-radius:8px}
.stat .val{font-size:24px;font-weight:900;color:#e0e0e0}
.stat .val.gold{color:#ffb300}
.stat .val.green{color:#69f0ae}
.stat .lbl{font-size:10px;color:#78909c;margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 10px;text-align:left;font-size:11px;border-bottom:1px solid rgba(0,229,255,.06)}
th{color:#546e7a;font-weight:600}
td{color:#b0bec5}
td.num{text-align:right;color:#00e5ff;font-weight:600;font-family:Consolas,monospace}
.ver{position:fixed;bottom:16px;right:20px;color:rgba(0,229,255,.25);font-size:10px}
#login-msg{text-align:center;padding:40px;color:#546e7a}
#login-msg a{color:#00e5ff}
</style>
</head>
<body>
<a class="back" href="/">← 首页</a>
<div class="container">
  <h1><span>数</span>据<span>统</span>计</h1>
  <p class="sub">STATISTICS</p>
  <div id="content"></div>
</div>
<div class="ver">alpha 0.3.0</div>

<script>
var TOKEN=localStorage.getItem("mj_token"),USER=localStorage.getItem("mj_user");
if(!TOKEN||!USER){document.getElementById("content").innerHTML='<div id="login-msg"><p>请先<a href="/auth?back=/stats">登录</a>查看数据</p></div>'}
else loadStats();

async function loadStats(){
  try{
    var resp=await fetch("/api/stats?token="+encodeURIComponent(TOKEN));
    var data=await resp.json();
    if(data.error){document.getElementById("content").innerHTML='<div id="login-msg"><p>'+data.error+'</p><p style="margin-top:8px"><a href="/">去首页</a></p></div>';return}
    render(data);
  }catch(e){document.getElementById("content").innerHTML='<div id="login-msg">加载失败</div>'}
}

function render(d){
  var s=d.stats;if(!s){return}
  var html='<div class="card"><h2>'+d.user+' 的概览</h2><div class="grid">';
  html+='<div class="stat"><div class="val">'+(s.games||0)+'</div><div class="lbl">总局数</div></div>';
  html+='<div class="stat"><div class="val">'+(s.rounds||0)+'</div><div class="lbl">总盘数</div></div>';
  html+='<div class="stat"><div class="val green">'+((s.win_rate||0)+"%")+'</div><div class="lbl">和牌率</div></div>';
  html+='<div class="stat"><div class="val">'+((s.combo_rate||0)+"%")+'</div><div class="lbl">组合率</div></div>';
  html+='<div class="stat"><div class="val gold">'+(s.avg_pts||0)+'</div><div class="lbl">均点</div></div>';
  html+='<div class="stat"><div class="val">'+(s.avg_win_pts||0)+'</div><div class="lbl">均和点</div></div>';
  html+='<div class="stat"><div class="val">'+(s.avg_combo_pts||0)+'</div><div class="lbl">均组合点</div></div>';
  html+='</div></div>';

  // 番种统计
  var fw=s.fan_wins||{},fc=s.fan_combos||{};
  var all={};Object.keys(fw).forEach(function(k){all[k]=1});Object.keys(fc).forEach(function(k){all[k]=1});
  var fans=Object.keys(all).sort(function(a,b){
    var ta=(fw[a]||0)+(fc[a]||0),tb=(fw[b]||0)+(fc[b]||0);
    return tb-ta;
  });
  if(fans.length){
    html+='<div class="card"><h2>番种明细</h2><table><thead><tr><th>番种</th><th style="text-align:right">和出</th><th style="text-align:right">组合</th></tr></thead><tbody>';
    fans.forEach(function(f){
      html+='<tr><td>'+f+'</td><td class="num">'+(fw[f]||0)+'</td><td class="num">'+(fc[f]||0)+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  document.getElementById("content").innerHTML=html;
}
</script>
</body>
</html>
