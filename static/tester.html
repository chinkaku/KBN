<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算番测试 — 组合麻将</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg0:#0a0f14;--bg1:#111822;--bg2:#182230;--cyan:#00e5ff;--cyan-dim:rgba(0,229,255,.15);--gold:#ffb300;--text:#b0bec5;--text2:#78909c;--white:#e0e0e0;--red:#ff5252;--green:#69f0ae}
body{font-family:Segoe UI,Microsoft YaHei,sans-serif;background:var(--bg0);height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;align-items:center}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse 60% 40% at 50% 40%,var(--cyan-dim),transparent 70%),linear-gradient(180deg,var(--bg0),var(--bg1));z-index:0}
a.back{position:fixed;top:14px;left:16px;color:var(--text2);font-size:11px;font-weight:600;text-decoration:none;padding:4px 12px;border:1px solid var(--cyan-dim);border-radius:12px;background:rgba(15,20,30,.8);z-index:10}
a.back:hover{color:var(--cyan);border-color:var(--cyan)}
#app{position:relative;z-index:1;width:700px;max-width:95vw;margin-top:60px;display:flex;flex-direction:column;gap:12px}
h2{color:var(--white);font-size:22px;font-weight:700;text-align:center;letter-spacing:2px;margin-bottom:8px}
h2 span{color:var(--cyan)}
#input{display:flex;gap:8px}
#inp{flex:1;padding:12px 16px;border:1.5px solid var(--cyan-dim);border-radius:10px;background:rgba(20,30,45,.9);color:var(--white);font-size:15px;font-family:monospace;outline:none}
#inp:focus{border-color:var(--cyan)}
#inp::placeholder{color:var(--text2);font-size:13px}
button{width:80px;border:1.5px solid rgba(0,229,255,.3);border-radius:10px;background:linear-gradient(180deg,rgba(30,42,60,.9),rgba(20,30,45,.9));color:var(--cyan);font-size:14px;font-weight:700;cursor:pointer;transition:all .12s}
button:hover{border-color:var(--cyan);background:rgba(0,229,255,.1);box-shadow:0 0 12px rgba(0,229,255,.1)}
#result{min-height:200px;padding:16px 20px;border:1px solid var(--cyan-dim);border-radius:10px;background:rgba(15,20,30,.7);overflow-y:auto;max-height:55vh}
#result .parse{color:var(--text2);font-size:12px;margin-bottom:6px}
#result .fan-line{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
#result .fan-group{color:var(--text2);width:80px;font-size:11px}
#result .fan-name{color:var(--white);flex:1}
#result .fan-val{color:var(--gold);font-weight:700;min-width:44px;text-align:right}
#result .total{color:var(--cyan);font-size:18px;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid var(--cyan-dim)}
#result .err{color:var(--red);font-size:13px}
.hint{color:var(--text2);font-size:10px;text-align:center;letter-spacing:.5px}
</style>
</head>
<body>
<div id="bg"></div>
<a class="back" href="/">← 首页</a>
<div id="app">
  <h2><span>算</span>番 <span>测</span>试</h2>
  <div id="input">
    <input id="inp" placeholder="和牌: 123456789m222m33m  流局: 123345567m269pF">
    <button onclick="calc()">计算</button>
  </div>
  <div id="result"></div>
  <div class="hint">格式: 牌张+门风+和牌方式+副露 | 示例: 123456789m22m!%</div>
</div>
<script>
async function calc(){
  var v=document.getElementById("inp").value.trim();
  if(!v)return;
  var r=document.getElementById("result");
  r.innerHTML='<span style=color:#78909c>计算中...</span>';
  try{
    var res=await fetch("/api/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({input:v})});
    var data=await res.json();
    if(data.error){r.innerHTML='<div class=err>'+data.error+'</div>';return}
    var h='';
    if(data.parse){h+='<div class=parse>手牌('+data.parse.hand_count+'): '+data.parse.hand.join(' ')+'</div>';
      if(data.parse.melds)data.parse.melds.forEach(function(m){h+='<div class=parse>副露: '+m+'</div>'});}
    if(data.total==-1){h+='<div class=err>不能组成和牌型，牌型无效</div>'}
    else if(data.total==-2){h+='<div class=err>牌张数错误</div>'}
    else{
      h+='<div class=total>'+data.win_type+' | '+data.fan+'番 · '+data.score+'分</div>';
      if(data.details)data.details.forEach(function(d){h+='<div class=fan-line><span class=fan-group>'+d.group+'</span><span class=fan-name>'+d.name+'</span><span class=fan-val>'+d.fan+'番</span></div>'});
    }
    r.innerHTML=h;
  }catch(e){r.innerHTML='<div class=err>请求失败: '+e.message+'</div>'}
}
document.getElementById("inp").addEventListener("keydown",function(e){if(e.key=="Enter")calc()});
</script>
</body>
</html>
