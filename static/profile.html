<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 — 组合麻将</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg0:#0a0f14;--bg1:#111822;--bg2:#182230;--cyan:#00e5ff;--cyan-dim:rgba(0,229,255,.15);--gold:#ffb300;--text:#b0bec5;--text2:#78909c;--white:#e0e0e0;--green:#69f0ae}
body{font-family:Segoe UI,Microsoft YaHei,sans-serif;background:var(--bg0);min-height:100vh;color:var(--text)}
a.back{position:fixed;top:14px;left:16px;color:var(--text2);font-size:11px;font-weight:600;text-decoration:none;padding:4px 12px;border:1px solid var(--cyan-dim);border-radius:10px;z-index:20}
a.back:hover{color:var(--cyan);border-color:var(--cyan)}
.topbar{position:fixed;top:14px;right:20px;display:flex;gap:8px;align-items:center;z-index:20;color:var(--text2);font-size:11px}
.topbar a{color:var(--cyan);text-decoration:none;padding:4px 12px;border:1px solid var(--cyan-dim);border-radius:10px}
.topbar a:hover{border-color:var(--cyan)}
.topbar span{color:var(--cyan);font-weight:600}
.container{max-width:700px;margin:0 auto;padding:64px 20px 40px}
h1{font-size:26px;color:var(--white);text-align:center;margin-bottom:4px;letter-spacing:2px}
h1 span{color:var(--cyan)}
.sub{color:var(--text2);font-size:11px;text-align:center;margin-bottom:24px}
.card{background:var(--bg2);border:1px solid var(--cyan-dim);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{color:var(--cyan);font-size:14px;font-weight:700;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{text-align:center;padding:12px 8px;background:rgba(0,229,255,.04);border-radius:8px}
.stat .val{font-size:22px;font-weight:900;color:var(--white)}
.stat .val.gold{color:var(--gold)}
.stat .val.green{color:var(--green)}
.stat .lbl{font-size:10px;color:var(--text2);margin-top:2px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 10px;text-align:left;font-size:11px;border-bottom:1px solid rgba(0,229,255,.06)}
th{color:var(--text2);font-weight:600}
td{color:var(--text)}
td.num{text-align:right;color:var(--cyan);font-weight:600;font-family:Consolas,monospace}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--gold));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#0a0f14;margin:0 auto 12px}
.name-row{text-align:center;margin-bottom:16px}
.name-row .uname{font-size:20px;font-weight:700;color:var(--white)}
.name-row .level{display:inline-block;margin-top:6px;padding:3px 12px;border:1px solid var(--gold);border-radius:12px;color:var(--gold);font-size:11px}
</style>
</head>
<body>
<a class="back" href="/">← 首页</a>
<div class="topbar"><a href="/forum">论坛</a><a href="#" onclick="doLogout()">登出</a></div>
<div class="container" id="content">加载中...</div>
<script>
var TOKEN=localStorage.getItem("mj_token")||"",USER=localStorage.getItem("mj_user")||"";
function doLogout(){localStorage.removeItem("mj_user");localStorage.removeItem("mj_token");location.href="/"}
async function load(){
  if(!TOKEN||!USER){document.getElementById("content").innerHTML='<p style="text-align:center;padding:40px;color:var(--text2)">请先<a href="/auth?back=/profile" style="color:var(--cyan)">登录</a></p>';return}
  var r=await fetch("/api/forum/profile?token="+encodeURIComponent(TOKEN));var d=await r.json();
  if(d.error){document.getElementById("content").innerHTML='<p style="text-align:center;padding:40px;color:var(--text2)">'+d.error+'</p>';return}
  var s=d.stats||{},p=d.profile||{};
  var h='<div class="name-row"><div class="avatar">'+d.user[0]+'</div><div class="uname">'+d.user+'</div><div class="level">组合等级 Lv.'+p.level+' · '+p.points+' 积分</div></div>';
  h+='<div class="card"><h2>游戏数据</h2><div class="grid">';
  h+='<div class="stat"><div class="val">'+(s.games||0)+'</div><div class="lbl">总局数</div></div>';
  h+='<div class="stat"><div class="val">'+(s.rounds||0)+'</div><div class="lbl">总盘数</div></div>';
  h+='<div class="stat"><div class="val green">'+(s.wins||0)+'</div><div class="lbl">和牌</div></div>';
  h+='<div class="stat"><div class="val">'+(s.combos||0)+'</div><div class="lbl">组合</div></div>';
  h+='<div class="stat"><div class="val gold">'+(s.total_pts||0)+'</div><div class="lbl">总得点</div></div>';
  h+='<div class="stat"><div class="val">'+(s.win_rate||0)+'%</div><div class="lbl">和牌率</div></div>';
  h+='</div></div>';
  // 番种
  var fw=s.fan_wins||{},fc=s.fan_combos||{};
  var all={};Object.keys(fw).forEach(function(k){all[k]=1});Object.keys(fc).forEach(function(k){all[k]=1});
  var fans=Object.keys(all).sort(function(a,b){return ((fw[b]||0)+(fc[b]||0))-((fw[a]||0)+(fc[a]||0))});
  if(fans.length){
    h+='<div class="card"><h2>番种明细</h2><table><thead><tr><th>番种</th><th style="text-align:right">和出</th><th style="text-align:right">组合</th></tr></thead><tbody>';
    fans.forEach(function(f){h+='<tr><td>'+f+'</td><td class="num">'+(fw[f]||0)+'</td><td class="num">'+(fc[f]||0)+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  // 收藏
  var favs=d.favorites||[];
  h+='<div class="card"><h2>我的收藏 ('+favs.length+')</h2>';
  if(!favs.length)h+='<p style="color:var(--text2);font-size:12px">暂无收藏</p>';
  else{h+='<table><tbody>';favs.forEach(function(f){h+='<tr><td><a href="/forum" style="color:var(--cyan);text-decoration:none">'+f.title+'</a></td><td style="text-align:right;color:var(--text2)">'+f.author+'</td></tr>'})h+='</tbody></table>'}
  h+='</div>';
  document.getElementById("content").innerHTML=h;
}
load();
</script>
</body>
</html>
