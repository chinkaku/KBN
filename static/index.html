<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组合麻将</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,Microsoft YaHei,sans-serif;background:#0a0f14;height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse 60% 30% at 50% 40%,rgba(0,229,255,.05),transparent 70%),radial-gradient(ellipse 40% 20% at 30% 80%,rgba(255,179,0,.03),transparent 70%),linear-gradient(180deg,#0a0f14,#111822);z-index:0}
#content{position:relative;z-index:1;text-align:center}
h1{font-size:80px;font-weight:900;color:#e0e0e0;letter-spacing:12px;margin-bottom:6px;text-shadow:0 0 60px rgba(0,229,255,.12),0 2px 4px rgba(0,0,0,.6)}
h1 span{display:inline-block}
.sub{color:#546e7a;font-size:14px;letter-spacing:6px;margin-bottom:56px;text-transform:uppercase}
.btns{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
a.big{display:inline-flex;align-items:center;justify-content:center;width:220px;height:68px;border:1.5px solid rgba(0,229,255,.25);border-radius:16px;background:linear-gradient(180deg,rgba(30,42,60,.9),rgba(20,30,45,.9));color:#00e5ff;font-size:20px;font-weight:700;text-decoration:none;letter-spacing:3px;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .2s}
a.big:hover{border-color:#00e5ff;background:rgba(0,229,255,.1);box-shadow:0 0 36px rgba(0,229,255,.15);transform:translateY(-3px)}
a.big.gold{border-color:rgba(255,179,0,.25);color:#ffb300}
a.big.gold{border-color:rgba(255,179,0,.25);color:#ffb300}
a.big.gold:hover{border-color:#ffb300;background:rgba(255,179,0,.08);box-shadow:0 0 36px rgba(255,179,0,.12)}
a.big.lobby{border-color:rgba(179,136,255,.25);color:#b388ff}
a.big.lobby:hover{border-color:#b388ff;background:rgba(179,136,255,.08);box-shadow:0 0 36px rgba(179,136,255,.12)}
a.big.locked{opacity:.35;cursor:not-allowed;pointer-events:none;filter:grayscale(.6)}
a.big.locked:hover{transform:none;box-shadow:none;border-color:rgba(179,136,255,.25)}
#stats-link:hover{border-color:#69f0ae!important;background:rgba(105,240,174,.08)!important;box-shadow:0 0 36px rgba(105,240,174,.1)!important}
#global-link:hover{border-color:#ffb300!important;background:rgba(255,179,0,.08)!important;box-shadow:0 0 36px rgba(255,179,0,.1)!important}
/* 登录状态栏 */
#auth-bar{position:fixed;top:14px;right:20px;display:flex;align-items:center;gap:8px;color:#546e7a;font-size:11px;z-index:10}
#auth-bar span{color:#00e5ff;font-weight:600;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#auth-bar a{color:#546e7a;text-decoration:none;padding:3px 10px;border:1px solid rgba(0,229,255,.12);border-radius:8px;font-size:10px;transition:all .12s}
#auth-bar a:hover{color:#00e5ff;border-color:#00e5ff}
.ver{position:fixed;bottom:18px;right:22px;color:rgba(0,229,255,.25);font-size:10px;letter-spacing:1px}
</style>
</head>
<body>
<div id="bg"></div>
<div id="auth-bar">
  <span id="auth-user">--</span>
  <a id="auth-login" href="/auth?back=/">登录</a>
  <a id="auth-out" href="#" style="display:none;color:#ff5252;border-color:rgba(255,82,82,.2)" onclick="userLogout()">登出</a>
</div>
<div id="content">
  <h1><span>组</span><span>合</span><span>麻</span><span>将</span></h1>
  <p class="sub">COMBINATION MAHJONG</p>
  <div class="btns">
    <a class="big" href="/game">单人游戏</a>
    <a class="big lobby locked" href="javascript:void(0)" title="联机模式开发中">联机对战 🔒</a>
    <a class="big gold" href="/tester">算番测试</a>
    <a class="big" href="/fans" style="border-color:rgba(179,136,255,.25);color:#b388ff">番种表</a>
    <a class="big" href="/forum" id="forum-link" style="display:none;border-color:rgba(105,240,174,.25);color:#69f0ae">论坛</a>
  </div>
  <div class="btns" style="margin-top:24px">
    <a class="big" href="/stats" id="stats-link" style="display:none;border-color:rgba(105,240,174,.25);color:#69f0ae;font-size:18px;line-height:68px;padding:0">数据统计</a>
    <a class="big" href="/global-stats" id="global-link" style="display:none;border-color:rgba(255,179,0,.2);color:#ffb300;font-size:18px;line-height:68px;padding:0">全局统计</a>
  </div>
</div>
<div class="ver">alpha 0.3.0</div>
<script>
(function(){
  var u=localStorage.getItem("mj_user"),t=localStorage.getItem("mj_token");
  var span=document.getElementById("auth-user");
  var login=document.getElementById("auth-login");
  var out=document.getElementById("auth-out");
  if(u&&t){span.textContent=u;login.style.display="none";out.style.display="inline";document.getElementById("stats-link").style.display="inline-block";if(u==="chinkaku"){document.getElementById("global-link").style.display="inline-block";document.getElementById("forum-link").style.display="inline-flex"}}
  else{span.textContent="未登录";login.style.display="inline";out.style.display="none"}
})();
function userLogout(){localStorage.removeItem("mj_user");localStorage.removeItem("mj_token");location.reload()}
</script>
</body>
</html>
